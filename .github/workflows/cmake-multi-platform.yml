name: CI/CD Pipeline for Qt App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: 6.7.0
        host: ${{ matrix.os == 'windows-latest' && 'windows' || 'mac' }}
        target: desktop
        arch: 'x86_64'
        modules: 'qtbase qttools'

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install ninja

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ninja

    - name: Configure and Build (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir build
        cd build
        qt-cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:/Qt/6.7.0/mingw_64" ..
        cmake --build .

    - name: Configure and Build (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir build
        cd build
        qt-cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release ..
        cmake --build .

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}
        path: build
